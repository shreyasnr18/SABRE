apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sabre-ingress-gateway
  namespace: sabre-paas
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: paas.sabre.fleet
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: sabre-python-paas
            port:
              number: 8000
      - path: /security
        pathType: Prefix
        backend:
          service:
            name: sabre-java-security
            port:
              number: 8090
      - path: /automation
        pathType: Prefix
        backend:
          service:
            name: sabre-n8n
            port:
              number: 5678
