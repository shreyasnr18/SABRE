version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import requests; requests.get('http://localhost:8000/api/v1/health').raise_for_status()\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sabre-network

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sabre-network

networks:
  sabre-network:
    driver: bridge
