name: S.A.B.R.E. Master CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. C++ High-Speed Computational Engine Build & Verification
  build-cpp-core:
    name: Build & Test C++ Core Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install GCC 13 & Build Tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake g++

      - name: Compile C++ High-Speed Engine
        run: |
          mkdir -p backend/cpp_engine/bin
          g++ -O3 -std=c++17 -o backend/cpp_engine/bin/toll_engine backend/cpp_engine/toll_corridor_engine.cpp
          chmod +x backend/cpp_engine/bin/toll_engine

      - name: Verify C++ Execution Output
        run: ./backend/cpp_engine/bin/toll_engine --corridor CORR-NH48-DEL-MUM --class mav_4to6axle

  # 2. Java 17 Zero-Trust Security Shield Build & Audit Check
  build-java-security:
    name: Build & Test Java Security Shield
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Java Security Shield Bytecode
        run: |
          mkdir -p backend/java_security/bin
          javac -d backend/java_security/bin backend/java_security/SabreSecurityShield.java

      - name: Run Java Zero-Trust Verification CLI
        run: |
          java -cp backend/java_security/bin com.sabre.security.SabreSecurityShield --cli-verify "SABRE-SEC-TENANT-001" "TELEMATICS_READ"

  # 3. Python PaaS & Plugin Suite Test Automation
  test-python-backend:
    name: Test Python Backend & 17 Plugin Applications
    runs-on: ubuntu-latest
    needs: [build-cpp-core, build-java-security]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Pytest & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run Comprehensive Pytest Suite across all 17 Plugins
        run: python -m pytest backend/

  # 4. Container Build & Kubernetes Manifest Validation
  docker-and-k8s-validate:
    name: Validate Docker & K8s Infrastructure
    runs-on: ubuntu-latest
    needs: [test-python-backend]
    steps:
      - uses: actions/checkout@v3

      - name: Validate Docker Compose Configuration
        run: docker compose -f infra/docker/docker-compose.enterprise.yml config

      - name: Install Kubeval / Lint Manifests
        run: |
          echo "Validating Kubernetes Manifests in infra/k8s/"
          ls -la infra/k8s/
